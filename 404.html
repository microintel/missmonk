<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>404 - Not Found</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #fff;
    text-align: center;
  }
  .msg {
    font-size: clamp(1.5rem, 5vw, 3rem);
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  .code {
    display: block;
    font-size: clamp(0.9rem, 2.5vw, 1.2rem);
    color: #888;
    margin-top: 0.5rem;
    font-weight: 400;
  }
  .brand {
    margin-top: 2.5rem;
    font-size: 0.85rem;
    color: #666;
    letter-spacing: 0.03em;
  }
  .btn {
    display: inline-block;
    margin-top: 2rem;
    padding: 0.75rem 1.75rem;
    font-size: clamp(0.85rem, 2vw, 1rem);
    color: #000;
    background: #fff;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 600;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .btn:hover {
    opacity: 0.85;
  }
  .btn:active {
    transform: scale(0.97);
  }
  @media (max-width: 480px) {
    .msg {
      padding: 0 1rem;
    }
  }
</style>
</head>
<body>
  <div class="msg">
    Lesson coming soon
    <span class="code">Check back later</span>
  </div>
  
  <div class="brand">
    Missmonk · by Microintel
  </div>
</body>
</html>
